<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Battle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOADING -->
<div id="pantalla-carga">
    <div class="text-center">
        <div class="pokeball-spinner mx-auto mb-3"></div>
        <p class="text-white fs-5 mt-3">Cargando Pokémons</p>
    </div>
</div>

<div class="container py-4">
    <div class="text-center mb-4">
        <h1 class="display-4 fw-bold text-warning">Batalla Pokémon</h1>
    </div>

    <!-- SELECCIÓN -->
    <div id="selection-screen">
        <h4 class="text-center text-white mb-4">Elige tu Pokémon</h4>
        <div id="pokemon-list" class="row g-3 justify-content-center"></div>
        <div class="text-center mt-4">
            <button id="btn-start" class="btn btn-warning btn-lg fw-bold px-5 d-none" onclick="Iniciarbatalla()">
                 Comienza La Batalla
            </button>
        </div>
    </div>

    <!-- BATALLA -->
    <div id="battle-screen" class="d-none">
        <div class="row g-4">
            <!-- Jugador -->
            <div class="col-12 col-md-6">
                <div class="pokemon-battle-card p-3 text-center">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 id="player-name" class="fw-bold text-success mb-0"></h5>
                        <div id="player-types"></div>
                    </div>
                    <div class="d-flex justify-content-between mb-1">
                        <small>HP</small>
                        <small><span id="player-hp">0</span> / <span id="player-maxhp">0</span></small>
                    </div>
                    <div class="hp-bar-container mb-3">
                        <div id="player-hp-bar" class="hp-bar high" style="width:100%"></div>
                    </div>
                    <img id="player-sprite" src="" class="pokemon-sprite" width="180" alt="Player">
                    <div><span class="badge bg-success mt-2">👤 TÚ</span></div>
                </div>
            </div>
            <!-- Enemigo -->
            <div class="col-12 col-md-6">
                <div class="pokemon-battle-card p-3 text-center">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h5 id="enemy-name" class="fw-bold text-danger mb-0"></h5>
                        <div id="enemy-types"></div>
                    </div>
                    <div class="d-flex justify-content-between mb-1">
                        <small>HP</small>
                        <small><span id="enemy-hp">0</span> / <span id="enemy-maxhp">0</span></small>
                    </div>
                    <div class="hp-bar-container mb-3">
                        <div id="enemy-hp-bar" class="hp-bar high" style="width:100%"></div>
                    </div>
                    <img id="enemy-sprite" src="" class="pokemon-sprite" width="180" alt="Enemy">
                    <div><span class="badge bg-danger mt-2">🤖 MÁQUINA</span></div>
                </div>
            </div>
        </div>

        <!-- Log -->
        <div class="battle-log mt-3 text-light" id="battle-log"></div>

        <!-- Movimientos -->
        <div id="move-buttons" class="row g-2 mt-3"></div>

        <!-- Resultado -->
        <div id="battle-result" class="text-center mt-4 d-none">
            <h2 id="result-text" class="fw-bold mb-3"></h2>
            <button class="btn btn-warning btn-lg fw-bold px-4" onclick="restartGame()">🔄 Jugar de Nuevo</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js.js"></script>

</body>
</html>
